<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Contactos - TP3</title>
  <!-- Tailwind CSS v4 Browser Script -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased font-sans">

  <main class="max-w-4xl mx-auto py-10 px-4">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Agenda de Contactos</h1>
      <p class="text-slate-600 mt-2 text-sm">Administración y almacenamiento en CSV con Tailwind CSS</p>
    </header>

    <!-- Formulario para agregar / editar contacto -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
      <h2 id="form-title" class="text-xl font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100">
        Nuevo Contacto
      </h2>
      <form id="contact-form" class="space-y-4">
        <input type="hidden" id="contact-id">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="nombre" class="block text-sm font-semibold text-slate-700 mb-1">Nombre</label>
            <input 
              type="text" 
              id="nombre" 
              name="nombre" 
              required 
              placeholder="Ej. Juan Pérez"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
            >
          </div>

          <div>
            <label for="telefono" class="block text-sm font-semibold text-slate-700 mb-1">Teléfono</label>
            <input 
              type="tel" 
              id="telefono" 
              name="telefono" 
              required 
              placeholder="Ej. +54 9 381 ..."
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
            >
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">Correo Electrónico</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            placeholder="ejemplo@correo.com"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
          >
        </div>

        <div class="flex items-center gap-3 pt-2">
          <button 
            type="submit" 
            id="btn-guardar"
            class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg shadow-sm transition-colors cursor-pointer"
          >
            Guardar Contacto
          </button>
          <button 
            type="button" 
            id="btn-cancelar" 
            class="hidden px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium text-sm rounded-lg transition-colors cursor-pointer"
          >
            Cancelar Edición
          </button>
        </div>
      </form>
    </section>

    <!-- Lista de Contactos -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-xl font-bold text-slate-800">Contactos Guardados</h2>
          <p id="total-contactos" class="text-xs text-slate-500 mt-0.5">Cargando contactos...</p>
        </div>
        <div class="relative w-full sm:w-64">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Buscar contacto..." 
            class="w-full pl-3 pr-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
          >
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-slate-700 font-semibold uppercase text-xs tracking-wider border-b border-slate-200">
            <tr>
              <th scope="col" class="py-3.5 px-6">Nombre</th>
              <th scope="col" class="py-3.5 px-6">Teléfono</th>
              <th scope="col" class="py-3.5 px-6">Email</th>
              <th scope="col" class="py-3.5 px-6 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="contacts-table-body" class="divide-y divide-slate-100">
            <!-- Inserción dinámica de contactos con JS -->
          </tbody>
        </table>
      </div>

      <div id="empty-state" class="hidden text-center py-12 px-4 text-slate-500">
        <p class="text-sm">No hay contactos registrados todavía o no coinciden con la búsqueda.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
